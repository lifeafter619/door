<!doctype>
<html>
<head>

	<!-- Place this data between the <head> tags of your website -->
	<title>一分钟の单人成行❤️</title>
	<meta name="description" content="a one-minute minigame."/>
	<link rel="icon" type="image/png" href="favicon.png">

	<!-- Schema.org markup for Google+ -->
	<meta itemprop="name" content="It's a(door)able">
	<meta itemprop="description" content="a one-minute minigame.">
	<meta itemprop="image" content="http://ncase.me/door/thumbnail.png">

	<!-- Open Graph data -->
	<meta property="og:title" content="it's a(door)able">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://door.66619.eu.org">
	<meta property="og:image" content="http://ncase.me/door/thumbnail.png">
	<meta property="og:description" content="a one-minute minigame.">
	<meta property="og:site_name" content="it's a(door)able">

	<!-- Style -->
	<link rel="stylesheet" type="text/css" href="css/index.css">

	<!-- Falling Emoji Style -->
	<style>
		#falling-emoji-container {
			position: absolute;
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		.falling-emoji {
			position: absolute;
			top: -50px;
			font-size: 2em;
			opacity: 0;
			animation: fall linear infinite;
		}

		@keyframes fall {
			to {
				transform: translateY(100vh);
				opacity: 1;
			}
		}
	</style>

</head>
<body>

	<div id="loading"><div>等亿下下...</div></div>

	<div id="whole_container">

		<!--span style="display:none"-->
		<div id="screen_one">
			<canvas id="canvas_intro"></canvas>
		</div>

		<div id="screen_two">
			<div id="canvas_container">

				<canvas id="canvas_1" width="300" height="380"></canvas>
				<canvas id="canvas_2" width="300" height="380"></canvas>
				<canvas id="canvas_3" width="300" height="380" style="margin:0"></canvas>
				
				<div id="valentines_text"></div>
				<div id="rewind_text">蓦然回首....</div>
				<div id="replay_text">那人却在...灯火阑珊处...</div>

			</div>
		</div>
		<!--/span-->

		<div id="screen_three">

			<!-- Background and Message -->
			<div id="birthday_message" style="position: relative; text-align: center; font-size: 2em; padding: 50px; color: #333;">
				生日快乐🎂
				<div id="falling-emoji-container"></div>
			</div>

		</div>
		
	</div>
</body>
</html>

<script src="js/Key.js"></script>
<script src="js/game.js"></script>
<script src="js/popup.js"></script>
<script src="js/soundjs-0.6.0.min.js"></script>

<script>
//STAGE = 4;

function createFallingEmoji() {
	const emojiContainer = document.getElementById('falling-emoji-container');
	const emoji = document.createElement('div');
	emoji.className = 'falling-emoji';
	emoji.innerText = '🎂';
	emoji.style.left = Math.random() * 100 + 'vw';
	emoji.style.animationDuration = (Math.random() * 2 + 3) + 's';
	emojiContainer.appendChild(emoji);

	// Remove the emoji after animation ends to prevent DOM clutter
	emoji.addEventListener('animationend', () => {
		emojiContainer.removeChild(emoji);
	});
}

// Create multiple falling emojis at intervals
setInterval(createFallingEmoji, 500);
</script>
